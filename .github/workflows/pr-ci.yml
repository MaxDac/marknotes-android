name: PR CI

on:
  pull_request:
    branches: [main]
  # Prepare release dispatches it on the release branch: PRs it opens with GITHUB_TOKEN don't trigger pull_request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # contents: write submits the PR head's resolved Gradle dependency graph (see dependency-submission.yml).
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      # GitHub can't resolve Gradle version catalogs or transitive dependencies statically, so submit the
      # resolved graph for the PR head first. Fork PRs get a read-only token and fall back to static parsing.
      - if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-android-build
        with:
          setup-gradle: "false"
      - if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: gradle/actions/dependency-submission@v6
      # On workflow_dispatch there is no PR event: compare the dispatched commit against main.
      - uses: actions/dependency-review-action@v5
        with:
          base-ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          head-ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          fail-on-severity: high
          comment-summary-in-pr: ${{ github.event_name == 'pull_request' && 'on-failure' || 'never' }}
          retry-on-snapshot-warnings: true

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint"'
